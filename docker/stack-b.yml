services:
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change_me_please}
      - 'NEO4J_PLUGINS=["graph-data-science"]'
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  cassandra:
    image: cassandra:4.1
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

  es-logs:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.0}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - es_logs_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.15.0}
    environment:
      - ELASTICSEARCH_HOSTS=http://es-logs:9200
    ports:
      - "5601:5601"
    depends_on:
      - es-logs

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-8.15.0}
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ../elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      - es-logs

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.15.0}
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ../elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../logs:/var/log/pinakes:ro
    depends_on:
      - logstash

volumes:
  neo4j_data:
  cassandra_data:
  es_logs_data:
