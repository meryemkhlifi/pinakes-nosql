# Filebeat sends one event per line of logs/api.log (JSON fields already at the root).
input {
  beats { port => 5044 }
}

filter {
  # Use the request time written by the API as the event time (not the shipping time).
  date {
    match  => ["ts", "ISO8601"]
    target => "@timestamp"
  }
  # Country and coordinates of the client (private IPs have no location: that is normal).
  if [client_ip] {
    geoip {
      source            => "client_ip"
      target            => "geoip"
      ecs_compatibility => disabled
    }
  }
  mutate {
    convert      => { "status" => "integer" "latency_ms" => "float" }
    remove_field => ["ts", "agent", "ecs", "input", "host", "log"]
  }
}

output {
  elasticsearch {
    hosts           => ["http://es-logs:9200"]
    index           => "pinakes-logs-%{+YYYY.MM.dd}"
    manage_template => false   # the template comes from elk/setup_elk.py
  }
}
