input {
  beats { port => 5044 }
}

filter {
  date {
    match  => ["ts", "ISO8601"]
    target => "@timestamp"
  }
  if [client_ip] {
    geoip { source => "client_ip" target => "geoip" }
  }
  mutate {
    convert      => { "status" => "integer" "latency_ms" => "float" }
    remove_field => ["ts"]
  }
}

output {
  elasticsearch {
    hosts => ["http://es-logs:9200"]
    index => "pinakes-logs-%{+YYYY.MM.dd}"
  }
}
